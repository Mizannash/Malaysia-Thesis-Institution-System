# Netlify Configuration for Malaysian Thesis Institution System (MTIS)
# This file enables one-click deployment directly from GitHub.

[build]
  base = "frontend"
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify Next.js Runtime plugin (manages SSR, API routes, and App Router static optimization)
[[plugins]]
  package = "@netlify/plugin-nextjs"
