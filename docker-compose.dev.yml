services:
  postgres:
    image: postgres:17-alpine
    container_name: mtis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-malaysian_thesis_institution_system_mtis}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - mtis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-malaysian_thesis_institution_system_mtis}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mtis_pgdata:
